<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>juxt web demo</title>
<style>
  :root {
    --bg: #111; --panel: #181818; --bar: #1d1d1d; --fg: #ddd; --dim: #888;
    --accent: #26a69a; --hl: #ffd54f; --err: #cc4444; --line: #2c2c2c;
    --mono: "Courier New", ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.4 var(--mono); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; outline: none; }
  #titlebar { display: flex; align-items: center; gap: 10px; padding: 4px 10px;
    background: var(--bar); border-bottom: 1px solid var(--line); color: var(--dim); }
  #titlebar b { color: var(--accent); }
  #titlebar .sp { flex: 1; }
  #titlebar button { background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; padding: 1px 8px; border-radius: 3px; cursor: pointer; }
  #titlebar button:hover, #titlebar button.on { color: var(--fg); border-color: var(--accent); }
  #main { flex: 1; display: flex; min-height: 0; }
  .side { width: 230px; flex: none; background: var(--panel); overflow-y: auto;
    padding: 8px 10px; white-space: normal; }
  #keys { border-right: 1px solid var(--line); }
  #info { border-left: 1px solid var(--line); }
  .side h4 { margin: 10px 0 2px; color: var(--accent); font-weight: normal; }
  .side h4:first-child { margin-top: 0; }
  .side .row { display: flex; gap: 8px; }
  .side .row kbd { flex: none; min-width: 5.5em; color: var(--hl); font: inherit; }
  .side .path { word-break: break-all; margin-bottom: 8px; }
  .side .val { cursor: pointer; padding: 0 3px; border-radius: 2px; display: inline-block; }
  .side .val:hover { background: #2a2a2a; }
  .side .val.cur { background: var(--hl); color: #000; font-weight: bold; }
  #view { flex: 1; position: relative; min-width: 0; overflow: hidden; background: #0b0b0b;
    cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(0,0,0,.78); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 14px; max-width: 92%; text-align: center; color: var(--fg); pointer-events: none;
    transition: opacity .3s; }
  #hint kbd, .kbd { color: var(--hl); font: inherit; }
  #hint.hide { opacity: 0; }
  #focusmsg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.55); color: var(--fg); font-size: 15px; pointer-events: none; }
  #app:not(:focus-within) #focusmsg { display: flex; }
  #statusbar { padding: 4px 10px; background: var(--bar); border-top: 1px solid var(--line);
    white-space: pre; overflow: hidden; display: flex; gap: 14px; min-height: 26px; }
  #statusbar.hidden { display: none; }
  #status { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #helpline { color: var(--dim); }
  .hl { background: var(--hl); color: #000; padding: 0 2px; }
  .cand-cur { color: var(--hl); }
  .unbound { color: var(--err); }
  .dim { color: var(--dim); }

  #loading, #picker { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,.92); }
  #loading[hidden], #picker[hidden] { display: none; }
  #loading .bar { width: min(320px, 70vw); height: 6px; background: #2a2a2a; border-radius: 3px; margin-top: 10px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .pwrap { max-width: 860px; width: 100%; max-height: 100%; overflow-y: auto; padding: 18px 22px; }
  .pwrap h2 { margin: 0 0 4px; color: var(--accent); font-weight: normal; font-size: 18px; }
  #cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-top: 14px; }
  .card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; color: var(--fg);
    font: inherit; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; position: relative; }
  .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; }
  .card .num { position: absolute; right: 10px; top: 8px; color: var(--hl); }
  .card .ctitle { color: var(--fg); font-weight: bold; padding-right: 18px; }
  .card .caxes { color: var(--accent); }
  .card .caxes i { color: var(--dim); font-style: normal; }
  .card .cblurb { color: var(--dim); font-size: 12px; line-height: 1.45; }
  @media (max-width: 760px) { .side { display: none !important; } #statusbar { font-size: 11px; } }
</style>
</head>
<body>
<div id="app" tabindex="0">
  <div id="titlebar">
    <span><b>juxt</b> | <span id="tpl"></span></span>
    <span class="sp"></span>
    <button id="b-scn" title=":scenario">scenario: <span id="scn-name">…</span> ▾</button>
    <button id="b-keys" title=":keys">keys</button>
    <button id="b-info" title=":info">info</button>
    <button id="b-bar" title=":statusbar" class="on">status</button>
    <button id="b-full" title=":fullscreen">fullscreen</button>
  </div>
  <div id="main">
    <div class="side" id="keys" hidden></div>
    <div id="view">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="focusmsg">click here to give the demo keyboard focus</div>
      <div id="loading" hidden><div><div id="loading-text"></div><div class="bar"><i id="loading-bar"></i></div></div></div>
      <div id="picker" hidden>
        <div class="pwrap">
          <h2>Pick an example</h2>
          <p class="dim">Each scenario is a hypercube of congruent images — flip through it with the keys, exactly like the desktop app.</p>
          <div id="cards"></div>
        </div>
      </div>
    </div>
    <div class="side" id="info" hidden></div>
  </div>
  <div id="statusbar"><div id="status"></div><div id="helpline"></div></div>
</div>

<script src="app.js"></script>
<script src="scenarios/cities.js"></script>
<script src="scenarios/sentinel2.js"></script>
<script src="scenarios/reaction.js"></script>
<script src="scenarios/random.js"></script>
</body>
</html>
