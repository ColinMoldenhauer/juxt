<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>juxt</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<script>
  // choose the theme before first paint: ?theme=… > saved choice > system preference
  (function () {
    var t = null;
    try { t = new URLSearchParams(location.search).get("theme") || localStorage.getItem("juxt-demo-theme"); } catch (e) {}
    if (t !== "dark" && t !== "light") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<style>
  :root {
    --bg: #111; --panel: #181818; --bar: #1d1d1d; --fg: #ddd; --dim: #8a8a8a;
    --accent: #26a69a; --hl: #ffd54f; --hl-fg: #000; --kbd: #ffd54f; --err: #cc4444; --line: #2c2c2c;
    --view: #0b0b0b; --hover: #2a2a2a; --overlay: rgba(10,10,10,.94); --pop: #1d1d1d; --shade: rgba(0,0,0,.66);
    --mono: "Courier New", ui-monospace, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f4f4f2; --panel: #ffffff; --bar: #ebebe8; --fg: #222; --dim: #66665f;
    --accent: #00796b; --hl: #ffd54f; --hl-fg: #000; --kbd: #8a5200; --err: #c62828; --line: #d4d4cf;
    --view: #e4e4e0; --hover: #ededea; --overlay: rgba(244,244,242,.95); --pop: #ffffff; --shade: rgba(20,20,20,.5);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.4 var(--mono); overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; outline: none; }
  #titlebar { display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    background: var(--bar); border-bottom: 1px solid var(--line); color: var(--dim); }
  #titlebar a.brand { display: flex; align-items: center; gap: 7px; color: var(--fg); font-weight: bold; text-decoration: none; padding: 1px 6px; border-radius: 5px; cursor: pointer; }
  #titlebar a.brand:hover { background: var(--hover); }
  #titlebar .brand img { width: 22px; height: 22px; display: block; }
  #titlebar .tpl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #titlebar .sp { flex: 1; }
  #titlebar button { background: none; border: 1px solid var(--line); color: var(--dim);
    font: inherit; padding: 1px 8px; border-radius: 3px; cursor: pointer; }
  #titlebar button:hover, #titlebar button.on { color: var(--fg); border-color: var(--accent); }
  #main { flex: 1; display: flex; min-height: 0; }
  .side { width: 230px; flex: none; background: var(--panel); overflow-y: auto;
    padding: 8px 10px; white-space: normal; }
  #keys { border-right: 1px solid var(--line); }
  #info { border-left: 1px solid var(--line); }
  .side h4 { margin: 10px 0 2px; color: var(--accent); font-weight: normal; }
  .side h4:first-child { margin-top: 0; }
  .side .row { display: flex; gap: 8px; }
  .side .row kbd { flex: none; min-width: 5.5em; color: var(--kbd); font: inherit; }
  .side .path { word-break: break-all; margin-bottom: 8px; }
  .side .val { cursor: pointer; padding: 0 3px; border-radius: 2px; display: inline-block; }
  .side .val:hover { background: var(--hover); }
  .side .val.cur { background: var(--hl); color: var(--hl-fg); font-weight: bold; }
  #view { flex: 1; position: relative; min-width: 0; overflow: hidden; background: var(--view);
    cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: var(--pop); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 4px 18px rgba(0,0,0,.25);
    padding: 8px 14px; max-width: 92%; text-align: center; color: var(--fg); pointer-events: none;
    transition: opacity .3s; }
  #hint kbd, .kbd { color: var(--kbd); font: inherit; }
  #hint.hide { opacity: 0; }
  #focusmsg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: var(--shade); color: #fff; font-size: 15px; pointer-events: none; }
  #app:not(:focus-within) #focusmsg { display: flex; }
  #statusbar { padding: 4px 10px; background: var(--bar); border-top: 1px solid var(--line);
    white-space: pre; overflow: hidden; display: flex; gap: 14px; min-height: 26px; }
  #statusbar.hidden { display: none; }
  #status { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  #helpline { color: var(--dim); }
  .hl { background: var(--hl); color: var(--hl-fg); padding: 0 2px; }
  .cand-cur { color: var(--kbd); font-weight: bold; }
  .unbound { color: var(--err); }
  .dim { color: var(--dim); }

  #loading, #picker { position: absolute; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
    background: var(--overlay); }
  #loading[hidden], #picker[hidden] { display: none; }
  #loading .bar { width: min(320px, 70vw); height: 6px; background: var(--line); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); }

  /* scenario picker: big before/after sliders, almost no text; the grid scales to fill the window */
  #picker { background: var(--bg); }
  .pwrap { width: 100%; max-width: min(1500px, 100%); height: 100%; padding: 14px 22px 18px; display: flex; flex-direction: column; }
  .phead { flex: none; display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .phead img { width: 40px; height: 40px; }
  .phead h2 { margin: 0; font-size: 24px; font-weight: bold; letter-spacing: .3px; }
  .phead .sub { color: var(--dim); font-size: 14px; }
  #cards { flex: 1; min-height: 0; display: grid; gap: 14px; justify-content: center; align-content: center; grid-auto-rows: max-content;
    grid-template-columns: repeat(2, minmax(0, 1fr)); }      /* fitCards() in app.js sets the real column width */
  #cards.stack { overflow-y: auto; align-content: start; }
  .card { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--fg);
    font: inherit; padding: 0; cursor: pointer; display: flex; flex-direction: column; overflow: hidden; position: relative; container-type: inline-size;
    transition: transform .15s, border-color .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,.28); }
  .card .num { position: absolute; right: 10px; top: 8px; z-index: 3; background: var(--pop); color: var(--kbd); border-radius: 4px; padding: 0 7px; font-size: 12px; opacity: .9; }
  .card .meta { flex: none; padding: 10px 14px 13px; display: flex; flex-direction: column; gap: 8px; }
  .card .ctitle { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: clamp(16px, 2.3vh, 21px); font-weight: bold; }
  .card .count { color: var(--dim); font-size: 12px; font-weight: normal; white-space: nowrap; }
  .card .axes { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 5px; }
  .card .times { color: var(--dim); font-weight: bold; }
  .chip { --c: var(--accent); display: inline-flex; align-items: baseline; gap: 6px; padding: 2px 10px 2px 11px; border-radius: 999px;
    border: 1.5px solid var(--c); background: color-mix(in srgb, var(--c) 17%, transparent); color: var(--fg); font-size: clamp(12px, 3.9cqw, 17px); font-weight: bold; line-height: 1.5; }
  .chip b { color: color-mix(in srgb, var(--c) 72%, var(--fg)); font-size: .88em; }
  @media (max-width: 620px) { .pwrap { padding: 10px 12px 12px; } }

  /* The slider is animated with transforms only (compositor thread, no layout or paint per frame):
     a clip box slides left, and its image slides right by the same amount so the picture stays put. */
  .slider { display: block; position: relative; flex: none; width: 100%; aspect-ratio: 16 / 10; overflow: hidden; background: var(--view); contain: paint; }
  .slider img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .slider .clip, .slider .track { position: absolute; inset: 0; will-change: transform; animation: wipe 7s ease-in-out infinite; }
  .slider .clip { overflow: hidden; }
  .slider .clip img { will-change: transform; animation: unwipe 7s ease-in-out infinite; }
  .slider .track { pointer-events: none; }
  .slider .handle { position: absolute; top: 0; bottom: 0; right: 0; width: 3px; margin-right: -1.5px; background: #fff; box-shadow: 0 0 8px rgba(0,0,0,.6); }
  .slider .handle::after { content: "\2194"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 28px; height: 28px;
    border-radius: 50%; background: #fff; color: #222; display: flex; align-items: center; justify-content: center; font-size: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.5); }
  .slider .lbl { position: absolute; bottom: 8px; background: rgba(0,0,0,.62); color: #fff; border-radius: 4px; padding: 1px 8px; font-size: 12px; z-index: 2; }
  .slider .la { left: 8px; } .slider .lb { right: 8px; }
  @keyframes wipe   { 0%, 100% { transform: translateX(-94%); } 50% { transform: translateX(-6%); } }
  @keyframes unwipe { 0%, 100% { transform: translateX(94%); }  50% { transform: translateX(6%); } }
  @media (prefers-reduced-motion: reduce) {
    .slider .clip, .slider .track, .slider .clip img { animation: none; }
    .slider .clip, .slider .track { transform: translateX(-50%); } .slider .clip img { transform: translateX(50%); }
  }

  /* guided tour */
  #tour { position: fixed; inset: 0; z-index: 30; }
  #tour[hidden] { display: none; }
  #tour .spot { position: absolute; border-radius: 8px; border: 2px solid var(--accent); box-shadow: 0 0 0 100vmax var(--shade);
    transition: all .25s ease; pointer-events: none; }
  #tour .pop { position: absolute; width: min(340px, calc(100vw - 24px)); background: var(--pop); color: var(--fg); border: 1px solid var(--accent);
    border-radius: 10px; padding: 14px 16px 12px; box-shadow: 0 10px 30px rgba(0,0,0,.4); transition: all .25s ease; }
  #tour h3 { margin: 0 0 6px; font-size: 15px; color: var(--accent); }
  #tour p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
  #tour kbd { color: var(--kbd); font: inherit; font-weight: bold; }
  #tour .nav { display: flex; align-items: center; gap: 8px; }
  #tour .dots { flex: 1; display: flex; gap: 5px; }
  #tour .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  #tour .dots i.on { background: var(--accent); }
  #tour button { font: inherit; border: 1px solid var(--line); background: none; color: var(--fg); border-radius: 5px; padding: 3px 10px; cursor: pointer; }
  #tour button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  #tour button:hover { border-color: var(--accent); }
  #tour .x { position: absolute; top: 6px; right: 8px; border: none !important; color: var(--dim) !important; font-size: 18px; line-height: 1; padding: 0 4px !important; }
  @media (max-width: 760px) { .side { display: none !important; } #statusbar { font-size: 11px; } }
  @media (max-width: 620px) { #tpl, #b-keys, #b-info, #b-full { display: none; } #b-scn { white-space: nowrap; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; } }
</style>
</head>
<body>
<div id="app" tabindex="0">
  <div id="titlebar">
    <a class="brand" id="b-home" href="./" title="Back to the start screen"><img src="assets/logo-96.png" alt="" width="22" height="22">juxt</a>
    <span class="tpl" id="tpl"></span>
    <span class="sp"></span>
    <button id="b-scn" title="Switch scenario (:scenario)"><span id="scn-name">scenario</span> ▾</button>
    <button id="b-tour" title="Show the guided tour (:tour)">tour</button>
    <button id="b-keys" title="Shortcut sidebar (:keys)">keys</button>
    <button id="b-info" title="Info sidebar (:info)">info</button>
    <button id="b-bar" title="Status bar (:statusbar)" class="on">status</button>
    <button id="b-theme" title="Dark / light (:theme)">☀</button>
    <button id="b-full" title="Fullscreen (:fullscreen)">⛶</button>
  </div>
  <div id="main">
    <div class="side" id="keys" hidden></div>
    <div id="view">
      <canvas id="cv"></canvas>
      <div id="hint"></div>
      <div id="focusmsg">click here to give the demo keyboard focus</div>
      <div id="loading" hidden><div><div id="loading-text"></div><div class="bar"><i id="loading-bar"></i></div></div></div>
      <div id="picker" hidden>
        <div class="pwrap">
          <div class="phead"><img src="assets/logo-96.png" alt=""><div><h2>juxt</h2><div class="sub">Flip through plots along any axis. Pick a dataset.</div></div></div>
          <div id="cards"></div>
        </div>
      </div>
    </div>
    <div class="side" id="info" hidden></div>
  </div>
  <div id="statusbar"><div id="status"></div><div id="helpline"></div></div>
  <div id="tour" hidden><div class="spot" id="spot"></div><div class="pop" id="pop"></div></div>
</div>

<script>window.JUXT_V = "dev";   // replaced with the commit id by the Pages workflow, so stale caches cannot mix versions</script>
<script src="app.js"></script>
<script src="scenarios/cities.js"></script>
<script src="scenarios/sentinel2.js"></script>
<script src="scenarios/reaction.js"></script>
<script src="scenarios/random.js"></script>
</body>
</html>
