name: Build Binaries

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: juxt-windows.zip
          - os: ubuntu-latest
            artifact: juxt-linux.zip
          - os: macos-latest
            artifact: juxt-macos.zip
            extra_deps: pillow

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs full history to derive version from tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PySide6 wheels bundle Qt but still link against system EGL / XKB on Linux.
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libfontconfig1

      - name: Install dependencies
        run: pip install pyinstaller ".[ssh]" ${{ matrix.extra_deps }}

      - name: Build with PyInstaller
        run: pyinstaller juxt.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\juxt -DestinationPath juxt-windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd dist && zip -r ../juxt-linux.zip juxt

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../juxt-macos.zip juxt.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            ## Downloads

            No Python installation required — download the archive for your platform, extract it, and run.

            | Platform | File | Run |
            |---|---|---|
            | Windows | `juxt-windows.zip` | Extract, then double-click `juxt\juxt.exe` or run it from a command prompt |
            | Linux | `juxt-linux.zip` | Extract, then `./juxt/juxt path/to/config.yaml` |
            | macOS | `juxt-macos.zip` | Extract, then `open juxt.app` or double-click — **built for Apple Silicon (arm64), untested** |

            **macOS note:** macOS Gatekeeper will block the unsigned app on first launch.
            Right-click → Open → Open to bypass, or run:
            ```
            xattr -cr juxt.app && open juxt.app
            ```

            ---
            Also available via pip: `pip install juxt`
