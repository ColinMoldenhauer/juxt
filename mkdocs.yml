site_name: juxt
site_description: Fast desktop tool for navigating N-dimensional hypercubes of plots
site_url: https://juxt.readthedocs.io
repo_url: https://github.com/ColinMoldenhauer/juxt
repo_name: ColinMoldenhauer/juxt

docs_dir: docs

nav:
  - Home: index.md
  - Web demo: demo.md
  - UI overview: ui.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Navigation: navigation.md
  - Remote (SSH): remote.md

theme:
  name: material
  logo: assets/logo_transparent.png
  favicon: assets/logo_transparent.png
  # Light and dark, following the OS until the reader picks one with the
  # header toggle. Images ending in #only-light / #only-dark show in one only.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - include-markdown
